<!DOCTYPE html>
<html lang="pt-br">

<head>
    <title>Agendamento</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
</head>

<body>

    <div class="container">

        <div class="row">
            <div class="col-12 text-center mt-3">
                <h1>Agendamentos confirmados</h1>
            </div>
            <div class="col-12">
                <a href="/" class="btn btn-link">Novo agendamento</a>
            </div>
        </div>

        <div class="row mt-3">

            <table class="table">
                <thead>
                    <tr>
                        <th scope="col">Nome</th>
                        <th scope="col">Clínica</th>
                        <th scope="col">Especialidade</th>
                        <th scope="col"></th>
                    </tr>
                </thead>
                <tbody>
                    {{#agendamentos}}
                    <tr>
                        <td>{{nome}} {{sobrenome}}</td>
                        <td>{{clinica}}</td>
                        <td>{{especialidade}}</td>
                        <td>
                            <a class="btn btn-info mt-1" href="/detalhar/{{id}}">Detalhar</a>
                            <a class="btn btn-primary mt-1" href="/editar/{{id}}">Editar</a>
                            <a class="btn btn-danger mt-1" href="/excluir/{{id}}">Excluir</a>
                        </td>
                    </tr>
                    {{/agendamentos}}
                </tbody>
            </table>

        </div>
    </div>

</body>

</html>
